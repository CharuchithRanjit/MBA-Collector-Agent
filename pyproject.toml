[project]
name = "chief"
version = "0.1.0"
description = "Personal career agent for MBA recruiting — deterministic ranking, AI-assisted extraction and summarization, and a daily briefing."
readme = "README.md"
authors = [
    { name = "Charuchith Ranjit", email = "charuchith@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.0",
    "fastapi>=0.128.8",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.11.0",
    "rich>=15.0.0",
    "sqlmodel>=0.0.34",
    "structlog>=25.5.0",
    "trafilatura>=2.1.0",
    "typer>=0.23.2",
    "uvicorn>=0.39.0",
]

[project.scripts]
chief = "chief.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/chief/models.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = [
    "eval: real LLM calls against golden JD extractions; costs money, run explicitly with -m eval",
]
